#cloud-config
package_update: true
package_upgrade: false
packages:
  - nginx
write_files:
  - path: /var/www/html/index.html
    permissions: '0644'
    owner: root:root
    content: |
      <html>
      <body>
      <h1>Hello from Azure VM</h1>
      </body>
      </html>
runcmd:
  - systemctl enable nginx
  - systemctl restart nginx
