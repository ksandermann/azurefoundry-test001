#cloud-config
package_update: true
packages:
  - nginx
write_files:
  - path: /var/www/html/index.html
    owner: root:root
    permissions: "0644"
    content: |
      <html>
        <head><title>Hello World</title></head>
        <body>
          <h1>Hello from Azure VM</h1>
        </body>
      </html>
runcmd:
  - systemctl enable nginx
  - systemctl restart nginx
